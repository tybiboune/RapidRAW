name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend-lint:
    name: Frontend Lint & Format
    runs-on: windows-latest
    steps:
      # Keep LF line endings so Prettier/rustfmt checks match the repo.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Check Formatting
        run: npm run format:check
        continue-on-error: true

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Check Translation Sync
        run: npm run i18n:check
        continue-on-error: true

  fmt:
    name: cargo fmt
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ''
          rust-src-dir: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -p RapidRAW -- --check

  clippy:
    name: cargo clippy
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ''
          rust-src-dir: src-tauri

      # The only optional feature, `tethering`, needs libgphoto2 (Linux/macOS only),
      # so Windows runs clippy on the default feature set.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  skin-tests:
    name: cargo test (skin retouch)
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          rust-src-dir: src-tauri

      # The CPU skin retouch (renewal, dodge & burn) and the method switch: their unit tests need no GPU and no
      # model, so they run on every pull request.
      - name: Test
        working-directory: src-tauri
        run: cargo test --lib -- effects::dodge_burn effects::renewal effects::skin_method effects::ai_retouch
